name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create (e.g., v0.2.0)"
        required: true
        type: string
      move-major:
        description: "Also move the major tag (v1, v2, …)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate version input
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like v0.1.0" >&2
            exit 1
          fi

      - name: Build and verify dist
        run: npm run check:dist

      - name: Ensure tag does not already exist
        run: |
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ inputs.version }} already exists" >&2
            exit 1
          fi

      - name: Create tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Move minor tag (vX.Y)
        run: |
          version=${{ inputs.version }}
          version=${version#v}
          major=${version%%.*}
          minor_part=${version#${major}.}
          minor=${minor_part%%.*}
          git tag -f "v${major}.${minor}"
          git push origin "v${major}.${minor}" --force

      - name: Move major tag
        if: inputs.move-major
        run: |
          major=${{ inputs.version }}
          major=${major#v}
          major=${major%%.*}
          git tag -f "v${major}"
          git push origin "v${major}" --force

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.version }}" \
            --title "${{ inputs.version }}" \
            --generate-notes
